<span
  class="rating" [class.sm]="size === 'sm'"
  [class.readonly]="readonly"
  role="img"
  [attr.aria-label]="rating + ' out of 5 stars'"
  (mouseleave)="hoverValue = 0"
>
  <ng-container *ngFor="let star of stars">
    <button
      *ngIf="!readonly; else display"
      type="button"
      class="star btn btn-link p-0"
      [class.filled]="star <= (hoverValue || rating)"
      [attr.aria-label]="'Rate ' + star + (star === 1 ? ' star' : ' stars')"
      (click)="select(star)"
      (mouseenter)="hoverValue = star"
    >
      <i class="fa" [ngClass]="star <= (hoverValue || rating) ? 'fa-star' : 'fa-star-o'"></i>
    </button>
    <ng-template #display>
      <span class="star" [class.filled]="star <= rating">
        <i class="fa" [ngClass]="star <= rating ? 'fa-star' : 'fa-star-o'"></i>
      </span>
    </ng-template>
  </ng-container>
</span>
